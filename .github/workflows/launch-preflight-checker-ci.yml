name: Launch Preflight Checker CI

on:
  push:
    branches: [launch-preflight-checker]
    paths:
      - 'launch-preflight-checker/**'
      - '.github/workflows/launch-preflight-checker-ci.yml'
  pull_request:
    paths:
      - 'launch-preflight-checker/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launch-preflight-checker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

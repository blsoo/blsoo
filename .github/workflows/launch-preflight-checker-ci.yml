name: Launch Preflight Checker CI

on:
  push:
    branches: [launch-preflight-checker]
    paths:
      - 'launch-preflight-checker/**'
      - '.github/workflows/launch-preflight-checker-ci.yml'
      - 'render.yaml'
  pull_request:
    paths:
      - 'launch-preflight-checker/**'
      - '.github/workflows/launch-preflight-checker-ci.yml'
      - 'render.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launch-preflight-checker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Dependency consistency
        run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Compile check
        run: python -m compileall -q app tests
      - name: HTTP smoke test
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8080 >/tmp/launch-preflight-checker.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/health | grep -q '"ok":true'; then
              curl -fsS http://127.0.0.1:8080/ | grep -q 'Launch Preflight Checker'
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/launch-preflight-checker.log
          exit 1
      - name: Docker build
        run: docker build -t launch-preflight-checker:test .
